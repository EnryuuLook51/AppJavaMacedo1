  <rect width="2400" height="2074" fill="#fbfcfd"/>
  <text x="70" y="56" class="kicker">SISTEMA DE ACCESO A SERVICIOS UNIVERSITARIOS</text>
  <text x="70" y="112" class="title">Diagrama de clases - Fronteras y servicios de aplicacion</text>
  <text x="70" y="152" class="subtitle">Trazabilidad desde los diagramas de robustez hacia controles estables</text>
  <text x="2260" y="58" class="page">02 / 02</text>

  <!-- Dependencias entre fronteras y controles -->
  <path class="dep" marker-end="url(#arrow)" d="M330 410 V500 H1710 V590"/><text x="720" y="486" class="label">login, sesiones, contrasena y recuperacion</text>
  <path class="dep" marker-end="url(#arrow)" d="M900 410 V520 H470 V590"/><text x="550" y="507" class="label">usuarios, roles y cuentas</text>
  <path class="dep" marker-end="url(#arrow)" d="M1500 410 V470 H1560 V1380 H1870 V1450"/><text x="1575" y="960" class="label">consulta de eventos</text>
  <path class="dep" marker-end="url(#arrow)" d="M2070 410 V520 H650 V590"/><text x="1780" y="507" class="label">politica de seguridad</text>
  <!-- Servicios -->
  <path class="dep" marker-end="url(#arrow)" d="M840 850 H940"/><text x="850" y="830" class="label">delega</text>
  <path class="dep" marker-end="url(#triangle)" d="M1600 850 H1520"/><text x="1530" y="830" class="label">realiza</text>
  <path class="dep" marker-end="url(#arrow)" d="M470 1260 V1450"/><text x="490" y="1370" class="label">verifica permisos</text>
  <path class="dep" marker-end="url(#arrow)" d="M690 1260 V1360 H1810 V1450"/><text x="980" y="1345" class="label">registra intervenciones</text>
  <path class="dep" marker-end="url(#arrow)" d="M1870 1260 V1360 H1960 V1450"/><text x="1910" y="1335" class="label">registra intentos, cierres y solicitudes</text>
  <path class="dep" marker-end="url(#arrow)" d="M1600 1160 H1350 V1450"/><text x="1380" y="1145" class="label">calcula opciones vigentes</text>
  <path class="dep" marker-end="url(#arrow)" d="M1120 1450 V1110"/><text x="1140" y="1325" class="label">invoca cada 30 s</text>
  <path class="dep" marker-end="url(#arrow)" d="M1810 1450 H1420"/><text x="1510" y="1435" class="label">autoriza consulta</text>

  <!-- Fronteras derivadas de robustez -->
  <text x="70" y="205" class="section">Fronteras</text>
  <g><rect x="70" y="235" width="520" height="175" class="box"/><rect x="70" y="235" width="520" height="76" class="box head-boundary"/><text x="330" y="262" class="stereo">«boundary»</text><text x="330" y="297" class="class">PantallaAcceso</text><line x1="70" y1="311" x2="590" y2="311" class="rel"/><text x="92" y="344" class="method">+ iniciarSesion() · cerrarSesion()</text><text x="92" y="374" class="method">+ cambiarContrasena() · recuperarAcceso()</text></g>
  <g><rect x="640" y="235" width="520" height="175" class="box"/><rect x="640" y="235" width="520" height="76" class="box head-boundary"/><text x="900" y="262" class="stereo">«boundary»</text><text x="900" y="297" class="class">PantallaAdministracion</text><line x1="640" y1="311" x2="1160" y2="311" class="rel"/><text x="662" y="344" class="method">+ gestionarUsuarios() · gestionarRoles()</text><text x="662" y="374" class="method">+ intervenirCuenta() · gestionarSesiones()</text></g>
  <g><rect x="1210" y="235" width="520" height="175" class="box"/><rect x="1210" y="235" width="520" height="76" class="box head-boundary"/><text x="1470" y="262" class="stereo">«boundary»</text><text x="1470" y="297" class="class">PantallaAuditoria</text><line x1="1210" y1="311" x2="1730" y2="311" class="rel"/><text x="1232" y="344" class="method">+ establecerFiltros()</text><text x="1232" y="374" class="method">+ consultarBitacora()</text></g>
  <g><rect x="1780" y="235" width="550" height="175" class="box"/><rect x="1780" y="235" width="550" height="76" class="box head-boundary"/><text x="2055" y="262" class="stereo">«boundary»</text><text x="2055" y="297" class="class">PantallaPoliticaSeguridad</text><line x1="1780" y1="311" x2="2330" y2="311" class="rel"/><text x="1802" y="344" class="method">+ mostrarParametros()</text><text x="1802" y="374" class="method">+ actualizarParametros()</text></g>

  <!-- Servicios principales -->
  <text x="70" y="555" class="section">Controles de aplicacion</text>
  <g><rect x="70" y="590" width="770" height="670" class="box"/><rect x="70" y="590" width="770" height="78" class="box head-admin"/><text x="455" y="617" class="stereo">«control»</text><text x="455" y="653" class="class">ServicioAdministracion</text><line x1="70" y1="668" x2="840" y2="668" class="rel"/><text x="94" y="704" class="method">+ registrarUsuario(actor, datos, claveInicial): Usuario</text><text x="94" y="738" class="method">+ buscarUsuario(actor, criterio): ResumenUsuario [*]</text><text x="94" y="772" class="method">+ modificarDatos(actor, usuario, datos): void</text><text x="94" y="806" class="method">+ cerrarSesion(actor, sesion): void</text><text x="94" y="840" class="method">+ recuperarAcceso(actor, usuario): void</text><text x="94" y="874" class="method">+ desbloquearCuenta(actor, usuario): void</text><text x="94" y="908" class="method">+ deshabilitarCuenta(actor, usuario): void</text><text x="94" y="942" class="method">+ asignarRol(actor, usuario, rol, vigencia): void</text><text x="94" y="976" class="method">+ modificarVigencia(actor, asignacion, vigencia): void</text><text x="94" y="1010" class="method">+ retirarRol(actor, asignacion): void</text><text x="94" y="1044" class="method">+ configurarSeguridad(actor, valores): void</text><line x1="70" y1="1072" x2="840" y2="1072" class="rel"/><text x="94" y="1108" class="method">Responsabilidad: Usuario, AsignacionRol y PoliticaSeguridad.</text><text x="94" y="1142" class="method">Toda operacion sensible verifica permisos y registra auditoria.</text></g>
  <g><rect x="940" y="590" width="580" height="520" class="box"/><rect x="940" y="590" width="580" height="78" class="box head-access"/><text x="1230" y="617" class="stereo">«interface»</text><text x="1230" y="653" class="class">IControlAcceso</text><line x1="940" y1="668" x2="1520" y2="668" class="rel"/><text x="964" y="704" class="method">+ inicializarCredencial(secreto): CuentaAcceso</text><text x="964" y="738" class="method">+ cerrarSesionAdministrativa(sesion): void</text><text x="964" y="772" class="method">+ iniciarRecuperacion(usuario): void</text><text x="964" y="806" class="method">+ desbloquearCuenta(cuenta): void</text><text x="964" y="840" class="method">+ deshabilitarCuenta(usuario): void</text><text x="964" y="874" class="method">+ cerrarPorInactividad(ahora): void</text><line x1="940" y1="902" x2="1520" y2="902" class="rel"/><text x="964" y="938" class="method">Contrato publico usado por administracion y temporizador.</text><text x="964" y="972" class="method">Evita exponer hashes, contrasenas y tokens.</text></g>
  <g><rect x="1600" y="590" width="730" height="670" class="box"/><rect x="1600" y="590" width="730" height="78" class="box head-access"/><text x="1965" y="617" class="stereo">«control»</text><text x="1965" y="653" class="class">ServicioAutenticacion</text><line x1="1600" y1="668" x2="2330" y2="668" class="rel"/><text x="1624" y="704" class="method">+ iniciarSesion(id, secreto, equipo, red): Sesion</text><text x="1624" y="738" class="method">+ validarSesion(id, actividad): Sesion</text><text x="1624" y="772" class="method">+ cerrarSesionActual(sesion): void</text><text x="1624" y="806" class="method">+ cerrarSesionAdministrativa(sesion): void</text><text x="1624" y="840" class="method">+ cerrarPorInactividad(ahora): void</text><text x="1624" y="874" class="method">+ cambiarContrasena(sesion, actual, nueva): void</text><text x="1624" y="908" class="method">+ solicitarRecuperacion(identificacion): void</text><text x="1624" y="942" class="method">+ iniciarRecuperacion(usuario): void</text><text x="1624" y="976" class="method">+ completarRecuperacion(token, nueva): void</text><text x="1624" y="1010" class="method">- generarToken(usuario): TokenRecuperacion</text><line x1="1600" y1="1038" x2="2330" y2="1038" class="rel"/><text x="1624" y="1074" class="method">Responsabilidad: CuentaAcceso, Credencial, Sesion y Token.</text><text x="1624" y="1108" class="method">Registra intentos, cierres y solicitudes de recuperacion.</text><text x="1624" y="1142" class="method">CU-09 y CU-10 comparten la generacion segura de token.</text></g>

  <!-- Controles de apoyo -->
  <g><rect x="70" y="1450" width="730" height="390" class="box"/><rect x="70" y="1450" width="730" height="78" class="box head-authz"/><text x="435" y="1477" class="stereo">«control»</text><text x="435" y="1513" class="class">ServicioAutorizacion</text><line x1="70" y1="1528" x2="800" y2="1528" class="rel"/><text x="94" y="1564" class="method">+ rolesVigentes(usuario, fecha): Rol [*]</text><text x="94" y="1598" class="method">+ opcionesPermitidas(usuario, fecha): Permiso [*]</text><text x="94" y="1632" class="method">+ exigirPermiso(actor, codigo): void</text><text x="94" y="1666" class="method">+ exigirAdministracion(actor): void</text><text x="94" y="1700" class="method">+ validarAsignacion(usuario, rol): Boolean</text><line x1="70" y1="1728" x2="800" y2="1728" class="rel"/><text x="94" y="1764" class="method">Responsabilidad: Usuario, AsignacionRol, Rol y Permiso.</text></g>
  <g><rect x="880" y="1450" width="500" height="330" class="box"/><rect x="880" y="1450" width="500" height="78" class="box head-timer"/><text x="1130" y="1477" class="stereo">«control»</text><text x="1130" y="1513" class="class">GestorExpiracionSesiones</text><line x1="880" y1="1528" x2="1380" y2="1528" class="rel"/><text x="904" y="1564" class="method">+ ejecutar(ahora): void</text><line x1="880" y1="1592" x2="1380" y2="1592" class="rel"/><text x="904" y="1628" class="method">Actor secundario de CU-06.</text><text x="904" y="1662" class="method">Detecta y cierra solo sesiones vencidas.</text><text x="904" y="1696" class="method">No afecta otras sesiones activas.</text></g>
  <g><rect x="1460" y="1450" width="870" height="390" class="box"/><rect x="1460" y="1450" width="870" height="78" class="box head-audit"/><text x="1895" y="1477" class="stereo">«control»</text><text x="1895" y="1513" class="class">ServicioAuditoria</text><line x1="1460" y1="1528" x2="2330" y2="1528" class="rel"/><text x="1484" y="1564" class="method">+ registrarIntento(datos): void</text><text x="1484" y="1598" class="method">+ registrarIntervencion(actor, objetivo, accion, detalle): void</text><text x="1484" y="1632" class="method">+ registrarCierre(sesion, motivo): void</text><text x="1484" y="1666" class="method">+ registrarSolicitudRecuperacion(identificacion, resultado): void</text><text x="1484" y="1700" class="method">+ consultar(actor, filtros): RegistroAuditoria [*]</text><line x1="1460" y1="1728" x2="2330" y2="1728" class="rel"/><text x="1484" y="1764" class="method">Responsabilidad: RegistroAuditoria y sus cuatro especializaciones.</text></g>

  <!-- Cobertura -->
  <line x1="70" y1="1885" x2="2330" y2="1885" stroke="#c7d3d9" stroke-width="2"/>
  <text x="70" y="1925" class="section">Cobertura consolidada</text>
  <text x="70" y="1962" class="coverage">CU-01..03 Administracion de usuarios · CU-04..07 Autenticacion y sesiones · CU-08,09,10,19 Credenciales y recuperacion</text>
  <text x="70" y="1994" class="coverage">CU-11,20 Intervencion en cuentas · CU-12..14 Roles · CU-15,17,18 Auditoria · CU-16 Politica · CU-06 Temporizador</text>
  <text x="70" y="2038" class="foot">Criterio: los objetos de robustez se consolidan en fronteras y controles estables; mensajes, decisiones y validaciones no se modelan como clases.</text>
