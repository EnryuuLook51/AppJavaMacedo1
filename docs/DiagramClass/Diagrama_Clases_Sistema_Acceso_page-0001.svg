  <line x1="70" y1="1990" x2="2330" y2="1990" stroke="#c7d3d9" stroke-width="2"/>
  <text x="70" y="2022" class="foot">Notacion: - privado · + publico · ~ paquete · rombo lleno = composicion · triangulo vacio = generalizacion · flecha discontinua = dependencia.</text>
  <text x="70" y="2048" class="foot">Trazabilidad: RF-01 a RF-34 · RN-01 a RN-19 · CU-01 a CU-20. SolicitudRecuperacion cubre el registro indicado en CU-09.</text>
