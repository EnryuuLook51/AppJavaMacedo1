  <defs>
    <style>
      .title{font:700 44px 'DejaVu Sans',sans-serif;fill:#15364a}.kicker{font:700 18px 'DejaVu Sans',sans-serif;letter-spacing:1.5px;fill:#47677a}.subtitle{font:400 21px 'DejaVu Sans',sans-serif;fill:#526b79}.page{font:600 18px 'DejaVu Sans',sans-serif;fill:#637b88}
